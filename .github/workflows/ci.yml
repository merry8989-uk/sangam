name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
        working-directory: .
      - run: npm run lint
      - run: npx prisma generate
      - run: npm run build

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -c "import app.main"

  # Applies the whole Prisma schema to a real PostgreSQL and fails if any model
  # does not become a table, or if the push reports a warning or something it
  # could not execute.
  #
  # This exists because `prisma db push` is not usable on a small runner: the
  # CLI instantiates a WebAssembly build of the schema engine at load time and
  # that allocation fails under a tight memory limit. The native schema engine
  # has no such problem, and tools/verify-schema.py drives it directly.
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # only the engine is needed, not the whole app
      - run: npm install --no-save @prisma/engines@5
        working-directory: apps/web
      - run: pip install pgserver
      - run: python tools/verify-schema.py

  # Fails if any route can serialise a user's private columns.
  #
  # This guards a bug that really shipped: the public feed used
  # `include: { author: true }`, which selects every column of the User row, and
  # returned it verbatim - so anyone could read the bcrypt hash, the email
  # address and the phone number of every post author.
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check no route can leak a private column
        run: python3 tools/check-leaks.py

  # Validates the event schema and every call site that uses it.
  #
  # The standard asks for this explicitly. It catches a typo'd event name, a
  # property pointing at an enum that does not exist, and an event used on the
  # platform it does not belong to - all of which would otherwise be found weeks
  # later, in a dashboard, when the number looked wrong.
  events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the event schema and its call sites
        run: python3 tools/check-events.py

  # Fails if a sent anonymous message could ever be changed.
  #
  # The requirement is explicit - once sent, a message cannot be edited. Three
  # locks: no updatedAt in the schema, no update handler in the API, and this.
  immutable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check messages are write-once
        run: python3 tools/check-immutable.py
